name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          - runner: macos-13
            os: macos
            arch: x86_64
          - runner: macos-14
            os: macos
            arch: aarch64
          - runner: windows-latest
            os: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ALSA dev libraries (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary (linux/macos)
        if: runner.os != 'Windows'
        run: strip target/release/athan

      - name: Stage artifact (linux/macos)
        if: runner.os != 'Windows'
        run: cp target/release/athan athan-${{ matrix.os }}-${{ matrix.arch }}

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy target\release\athan.exe athan-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: athan-${{ matrix.os }}-${{ matrix.arch }}${{ runner.os == 'Windows' && '.exe' || '' }}
